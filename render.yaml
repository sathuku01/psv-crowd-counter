services:
  - type: web
    name: psv-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile.backend
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BUS_ID
        value: BUS-001
      - key: REPORT_INTERVAL
        value: 10s
      - key: BACKEND_PORT
        value: 8080
      - key: API_KEY
        generateValue: true
      - key: ENABLE_HTTPS
        value: "false"
      - key: USE_MOCK_IMPLEMENTATIONS
        value: "true"
    healthCheck:
      path: /api/v1/health
      interval: 30s
      timeout: 10s
      restartPolicy:
        maxRetries: 3
  - type: web
    name: psv-frontend
    env: docker
    plan: free
    dockerfilePath: Dockerfile.frontend
    envVars:
      - key: FRONTEND_PORT
        value: 3000
      - key: BACKEND_API_URL
        fromService:
          name: psv-backend
          property: host
      - key: MEDIAPIPE_URL
        value: http://localhost:5000
      - key: CROWD_DETECT_URL
        value: http://localhost:8081
    healthCheck:
      path: /api/health
      interval: 30s
      timeout: 10s
      restartPolicy:
        maxRetries: 3