services:
  - type: web
    name: psv-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile.backend
    envVars:
      - key: DATA_DIR
        value: /tmp/data
      - key: BUS_ID
        value: BUS-001
      - key: USE_MOCK_IMPLEMENTATIONS
        value: "true"
  - type: web
    name: psv-frontend
    env: docker
    plan: free
    dockerfilePath: Dockerfile.frontend
    envVars:
      - key: FRONTEND_PORT
        value: "3000"
      - key: BACKEND_API_URL
        fromService:
          name: psv-backend
          property: host
